name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip and build
        run: |
          set -e
          ZIP=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -i '\.zip$' | tail -n1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip | sort -V | tail -n1); fi
          echo "Using $ZIP"
          rm -rf build_app && mkdir build_app
          unzip -q "$ZIP" -d build_app
          cd build_app
          if [ "$(ls -A | wc -l)" = "1" ] && [ -d "$(ls -A)" ]; then cd "$(ls -A)"; fi
          npm install --no-audit --no-fund
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECORD_AUDIO VIBRATE RECEIVE_BOOT_COMPLETED; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\"/>\n</manifest>#" "$M"
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MyCalendar.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MyCalendar-APK
          path: MyCalendar.apk
